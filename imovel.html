<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script><script src="common.js"></script>

<title>Imóvel – D.R. Global Imóveis</title>
</head><body data-page="imoveis"><header id="header"></header>
<div class="wrap" id="main"><div class="empty" style="margin:40px 0">Carregando…</div></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img alt=""></div>
<footer id="footer"></footer>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const id = new URLSearchParams(location.search).get('id');
  try {
    if (!id) throw new Error('nf');
    const doc = await tenantRef().collection('vitrine').doc(id).get();
    if (!doc.exists) throw new Error('nf');
    const im = { id, ...doc.data() };
    let fotos = [];
    try { const fs = await tenantRef().collection('imoveis').doc(id).collection('fotos').orderBy('ordem').get(); fotos = fs.docs.map(d => d.data().url).filter(Boolean); } catch (_) {}
    if (!fotos.length && im.coverUrl) fotos = [im.coverUrl];
    document.title = titulo(im) + ' – D.R. Global Imóveis';
    const f = [['Quartos', im.quartos], ['Banheiros', im.banheiros], ['Vagas', im.vagas], ['Área útil', im.areaUtil && im.areaUtil + ' m²'], ['Área total', im.areaTotal && im.areaTotal + ' m²'], ['Andar', im.andar], ['Mobiliado', im.mobiliado]].filter(x => x[1]);
    const val = [['Aluguel', brl(im.aluguelSugerido)], ['Venda', brl(im.valorVenda)], ['Condomínio', brl(im.valorCondominio)], ['IPTU', brl(im.valorIPTU)]].filter(x => x[1]);
    const msg = 'Olá! Tenho interesse no imóvel "' + titulo(im) + '" (ref. ' + id.slice(0, 6) + ') que vi no site: ' + location.href;
    $('#main').innerHTML = `
      <p style="margin:22px 0 0"><a href="imoveis.html">← Voltar para a vitrine</a></p>
      ${fotos.length ? `<div class="gal"><img class="main" src="${esc(fotos[0])}" alt=""><div class="side">${fotos.slice(1, 3).map(u => `<img src="${esc(u)}" alt="">`).join('')}</div></div>` : '<div style="height:20px"></div>'}
      <div class="detail"><div>
        <span class="tag" style="position:static;display:inline-block">${badge(im)}</span>
        <h1 style="margin-top:.4em">${esc(titulo(im))}</h1><p class="loc">${esc(local(im))}</p>
        <div class="facts">${f.map(x => `<div><b>${esc(x[1])}</b>${x[0]}</div>`).join('')}</div>
        ${im.descricaoLonga ? `<div class="box"><h3>Descrição</h3><p style="white-space:pre-line">${esc(im.descricaoLonga)}</p></div>` : ''}
        ${fotos.length > 3 ? `<h3 style="margin-top:26px">Mais fotos</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${fotos.slice(3).map(u => `<img src="${esc(u)}" style="border-radius:10px;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in">`).join('')}</div>` : ''}
        ${im.videoUrl ? `<p><a href="${esc(im.videoUrl)}" target="_blank" rel="noopener">▶ Ver vídeo do imóvel</a></p>` : ''}
        ${im.tourUrl ? `<p><a href="${esc(im.tourUrl)}" target="_blank" rel="noopener">Tour virtual</a></p>` : ''}
      </div><div><div class="box sticky">
        ${val.length ? val.map(v => `<p style="display:flex;justify-content:space-between;margin:.4em 0"><span>${v[0]}</span><b>${v[1]}</b></p>`).join('') : '<p><b>Valores sob consulta</b></p>'}
        ${im.aceitaFinanciamento ? '<p class="small">✓ Aceita financiamento</p>' : ''}${im.permiteFGTS ? '<p class="small">✓ Aceita FGTS</p>' : ''}
        <a class="btn btn-wa" style="width:100%;text-align:center;margin-top:14px" target="_blank" rel="noopener" href="${wa(msg)}">Tenho interesse – WhatsApp</a>
        <p class="small" style="margin-top:12px;color:var(--muted)">Valores e disponibilidade sujeitos a confirmação. CRECI/PJ ${S.CRECI_PJ}.</p>
      </div></div></div>`;
    document.querySelectorAll('#main img').forEach(i => i.onclick = () => { $('#lb img').src = i.src; $('#lb').classList.add('on'); });
  } catch (e) {
    $('#main').innerHTML = '<div class="empty" style="margin:40px 0">Imóvel não encontrado ou não está mais disponível. <a href="imoveis.html">Ver outros imóveis</a></div>';
  }
});
</script></body></html>
